# HTTPS entry point, applied by deploy.sh when DOMAIN is set.
# Uses the global static IP "ds-catalog-ip" (reserved by deploy.sh) and the
# ManagedCertificate from certificate.yaml; HTTP is redirected to HTTPS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ds-catalog-ingress
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "ds-catalog-ip"
    networking.gke.io/managed-certificates: "ds-catalog-cert"
    networking.gke.io/v1beta1.FrontendConfig: "ds-catalog-frontend-config"
spec:
  defaultBackend:
    service:
      name: ds-catalog-frontend
      port:
        number: 80
