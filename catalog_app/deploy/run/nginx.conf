server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Increase buffer for large API responses
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;

    # Proxy all API requests to the backend container in the same Cloud Run instance
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloud Run terminates TLS; pass on the scheme the client used
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Matches the service's request timeout (timeoutSeconds in deploy.sh)
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
    }

    # SPA fallback — all other paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
