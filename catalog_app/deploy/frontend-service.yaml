apiVersion: v1
kind: Service
metadata:
  name: ds-catalog-frontend
  labels:
    app: ds-catalog-frontend
  annotations:
    # Container-native load balancing for the HTTPS Ingress (DOMAIN mode)
    cloud.google.com/neg: '{"ingress": true}'
spec:
  # ClusterIP behind the HTTPS Ingress when DOMAIN is set. Without DOMAIN, deploy.sh switches
  # this to LoadBalancer (plain HTTP on a public IP, testing only).
  type: ClusterIP
  selector:
    app: ds-catalog-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
